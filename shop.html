<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كل المنتجات | Shami Cosmetics</title>
<meta name="description" content="تسوق الصابون التركي الطبي الأصلي وعطور TWINS والبوكسات والهدايا من Shami Cosmetics. توصيل لجميع محافظات الأردن.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Shami Cosmetics">
<meta property="og:locale" content="ar_JO">
<meta property="og:title" content="كل المنتجات | Shami Cosmetics">
<meta property="og:description" content="الصابون التركي الطبي الأصلي وعطور TWINS الفاخرة والبوكسات والهدايا.">
<meta name="theme-color" content="#FBF8F2">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/catalog.css">
<script type="module" src="/assets/js/pages/shop.js"></script>
</head>
<body data-page="shop">
<noscript><p class="alert warning">يتطلب هذا الموقع تفعيل JavaScript في المتصفح.</p></noscript>

<main id="main">
  <div class="wrap">
    <header class="shop-head">
      <h1 data-slot="title" data-t="shop.titleAll"></h1>
      <p class="count" data-slot="count" aria-live="polite"></p>

      <form class="shop-search" role="search" data-slot="search-form" novalidate>
        <label class="sr-only" for="shop-q" data-t="shop.searchLabel"></label>
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="shop-q" name="q" type="search" autocomplete="off" enterkeyhint="search"
               data-t-attr="placeholder:shop.searchPlaceholder">
        <button type="button" class="icon-btn search-clear" data-slot="search-clear" hidden data-t-attr="aria-label:shop.searchClear">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </form>

      <nav class="shop-cats" data-slot="cats" data-t-attr="aria-label:shop.categoriesLabel"></nav>
    </header>

    <div class="shop-toolbar">
      <div class="seg" role="group" data-slot="gender" hidden data-t-attr="aria-label:shop.genderLabel">
        <button type="button" data-gender="" aria-pressed="true" data-t="shop.genderAll"></button>
        <button type="button" data-gender="men" aria-pressed="false" data-t="catalog.gender.men"></button>
        <button type="button" data-gender="women" aria-pressed="false" data-t="catalog.gender.women"></button>
      </div>
      <label class="check"><input type="checkbox" data-slot="instock"> <span data-t="shop.inStockOnly"></span></label>
      <span class="spacer"></span>
      <div class="sort-field">
        <label class="label" for="shop-sort" data-t="shop.sortLabel"></label>
        <select class="select" id="shop-sort" data-slot="sort">
          <option value="best" data-t="shop.sortBestseller"></option>
          <option value="new" data-t="shop.sortNewest"></option>
          <option value="price_asc" data-t="shop.sortPriceAsc"></option>
          <option value="price_desc" data-t="shop.sortPriceDesc"></option>
        </select>
      </div>
    </div>

    <div class="prod-grid shop-grid shop-results" data-slot="grid"></div>
    <div class="load-more"><button type="button" class="btn ghost" data-slot="more" hidden data-t="shop.loadMore"></button></div>
  </div>
</main>
</body>
</html>
